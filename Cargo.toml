[workspace]
resolver = "2"

members = [
    "apps/daemon",
    "apps/cli",
    "crates/domain",
    "crates/capabilities",
    "crates/policy",
    "crates/memory",
    "crates/storage",
    "crates/audit",
    "crates/protocol",
    "crates/ai",
    "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"

[workspace.dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
keyring = "4.0"
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.53.1", default-features = false, features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
url = "2.5"
zeroize = "1.8"

[workspace.lints.rust]
unsafe_code = "forbid"
